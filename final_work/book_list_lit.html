<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>书籍列表 - 图书馆</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">龚达图书馆</div>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="搜索书名/作者...">
                <button id="searchBtn">搜索</button>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">首页</a></li>
                <li><a href="categories.html">图书分类</a></li>
                <li><a href="contact.html">联系我们</a></li>
                <li><a href="login.html" id="loginLink">登录</a></li>
                <li id="userDisplay" style="display:none; color: var(--accent-color); font-weight: bold;"></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="book-list-container">
            <h1>文学类别书籍</h1>
            <p class="category-description">在这里可以找到所有的文学类书籍。</p>
            <div class="book-grid">
                <!-- 书籍卡片示例 -->
                <div class="book-card" onclick="location.href='detail.html?title=百年孤独'">
                    <img src="images/百年孤独.png" alt="图书封面">
                    <div class="book-card-info">
                        <h3>百年孤独</h3>
                        <p>加西亚·马尔克斯</p>
                        <span class="status available">可借阅</span>
                    </div>
                </div>
                <div class="book-card" onclick="location.href='detail.html?title=活着'">
                    <img src="images/活着.png" alt="图书封面">
                    <div class="book-card-info">
                        <h3>活着</h3>
                        <p>余华</p>
                        <span class="status available">可借阅</span>
                    </div>
                </div>
                <div class="book-card" onclick="location.href='detail.html?title=红楼梦'">
                    <img src="images/红楼梦.png" alt="图书封面">
                    <div class="book-card-info">
                        <h3>红楼梦</h3>
                        <p>曹雪芹</p>
                        <span class="status available">可借阅</span>
                    </div>
                </div>
                <div class="book-card" onclick="location.href='detail.html?title=围城'">
                    <img src="images/围城.png" alt="图书封面">
                    <div class="book-card-info">
                        <h3>围城</h3>
                        <p>钱钟书</p>
                        <span class="status available">可借阅</span>
                    </div>
                </div>
            </div>
            <div class="pagination">
                <a href="#" class="btn-small">上一页</a>
                <span class="page-num">1 / 5</span>
                <a href="#" class="btn-small">下一页</a>
            </div>
        </section>
    </main>
    <footer>
        <div class="footer-content container">
            <div class="footer-info">
                <p>&copy; 2026 龚达图书馆. All rights reserved.</p>
                <p>技术支持：前端开发大作业团队</p>
            </div>
            <div class="share-links">
                <span>分享到：</span>
                <a href="#">微信</a>
                <a href="#">微博</a>
                <a href="#">QQ</a>
            </div>
        </div>
    </footer>
    <button id="backToTop" class="back-to-top" onclick="window.scrollTo(0,0)">↑</button>
    <script src="js/script.js"></script>
</body>
</html>
