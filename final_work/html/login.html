<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图书馆登录</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="login-wrapper">
        <div class="login-container">
            <!-- 标签页切换 -->
            <div class="auth-tabs"
                style="display: flex; margin-bottom: 20px; border-bottom: 1px solid rgba(0,0,0,0.1);">
                <button class="tab-btn active" onclick="switchTab('login')"
                    style="flex: 1; padding: 10px 0; border: none; background: transparent; font-size: 18px; cursor: pointer; color: #333; border-bottom: 2px solid #8B7355;">登录</button>
                <button class="tab-btn" onclick="switchTab('register')"
                    style="flex: 1; padding: 10px 0; border: none; background: transparent; font-size: 18px; cursor: pointer; color: #666;">注册</button>
            </div>

            <!-- 原有登录表单（完全保留你的结构） -->
            <form id="login-form" class="login-form">
                <h2>用户登录</h2>
                <p class="subtitle">欢迎来到龚达图书馆</p>
                <div class="input-group">
                    <label for="username">用户名:</label>
                    <input type="text" id="username" required>
                </div>
                <div class="input-group">
                    <label for="password">密码:</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="login-btn">登录</button>
            </form>

            <!-- 注册表单（复用所有样式） -->
            <!-- 注册表单（必须和登录表单同级，class完全一样） -->
            <form id="register-form" class="login-form" style="display: none;">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="reg-username" placeholder="请输入用户名" required>
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="reg-password" placeholder="请输入密码（至少6位）" required>
                </div>
                <div class="form-group">
                    <label>确认密码</label>
                    <input type="password" id="reg-repassword" placeholder="请再次输入密码" required>
                </div>
                <button type="submit" class="login-btn">注册</button>
            </form>
        </div>
    </div>

    <script src="../js/script.js"></script>

</body>

</html>
