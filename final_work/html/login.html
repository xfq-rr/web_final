<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图书馆登录</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-container">
            <!-- 标签页切换 -->
            <div class="auth-tabs" style="display: flex; margin-bottom: 20px; border-bottom: 1px solid rgba(0,0,0,0.1);">
                <button class="tab-btn active" data-tab="login" style="flex: 1; padding: 10px 0; border: none; background: transparent; font-size: 18px; cursor: pointer; color: #333; border-bottom: 2px solid #8B7355;">登录</button>
                <button class="tab-btn" data-tab="register" style="flex: 1; padding: 10px 0; border: none; background: transparent; font-size: 18px; cursor: pointer; color: #666;">注册</button>
            </div>

            <!-- 登录表单（完全保留你原有结构和ID） -->
            <form id="login-form" class="login-form">
                <h2>用户登录</h2>
                <p class="subtitle">欢迎来到龚达图书馆</p>
                <div class="input-group">
                    <label for="username">用户名:</label>
                    <input type="text" id="username" required>
                </div>
                <div class="input-group">
                    <label for="password">密码:</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit">登录</button>
            </form>

            <!-- 注册表单（复用所有样式） -->
            <form id="register-form" class="login-form" style="display: none;">
                <h2>用户注册</h2>
                <p class="subtitle">欢迎加入龚达图书馆</p>
                <div class="input-group">
                    <label for="reg-username">用户名:</label>
                    <input type="text" id="reg-username" required placeholder="请设置用户名">
                </div>
                <div class="input-group">
                    <label for="reg-password">密码:</label>
                    <input type="password" id="reg-password" required placeholder="不少于6位">
                </div>
                <div class="input-group">
                    <label for="reg-repassword">确认密码:</label>
                    <input type="password" id="reg-repassword" required placeholder="再次输入密码">
                </div>
                <button type="submit">注册</button>
            </form>
        </div>
    </div>

    <script src="../js/script.js"></script>
</body>
</html>
