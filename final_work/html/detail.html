<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图书详情</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">龚达图书馆</div>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="搜索书名/作者...">
                <button id="searchBtn">搜索</button>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">首页</a></li>
                <li><a href="categories.html">图书分类</a></li>
                <li><a href="contact.html">联系我们</a></li>
                <li><a href="login.html" id="loginLink">登录</a></li>
                <li id="userDisplay" style="display:none; color: var(--accent-color); font-weight: bold;"></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="back-link">
            <a href="javascript:history.back()">&larr; 返回上一页</a>
        </div>
        <section class="book-detail">
            <div class="book-cover">
                <img src="../images/图书馆书架.png" alt="图书封面">
            </div>
            <div class="book-info">
                <h1 id="bookTitle">书名加载中...</h1>
                <p><strong>作者:</strong> <span id="bookAuthor">加载中...</span></p>
                <p><strong>出版社:</strong> <span id="bookPublisher">加载中...</span></p>
                <p><strong>ISBN:</strong> <span id="bookIsbn">加载中...</span></p>
                <p><strong>简介:</strong> <span id="bookDesc">加载中...</span></p>
                <button class="btn">借阅</button>
            </div>
        </section>
    </main>    <footer>
        <div class="footer-content container">
            <div class="footer-info">
                <p>&copy; 2026 龚达图书馆. All rights reserved.</p>
                <p>技术支持：前端开发大作业团队</p>
            </div>
            <div class="share-links">
                <span>分享到：</span>
                <a href="javascript:alert('已复制链接，可粘贴到微信分享！')">微信</a>
                <a href="https://service.weibo.com/share/share.php?url=http://127.0.0.1:3000/final_work/html/detail.html&title=龚达图书馆" target="_blank">微博</a>
                <a href="https://connect.qq.com/widget/shareqq/index.html?url=http://127.0.0.1:3000/final_work/html/detail.html&title=龚达图书馆" target="_blank">QQ</a>
            </div>
        </div>
    </footer>
    <button id="backToTop" class="back-to-top" onclick="window.scrollTo(0,0)">↑</button>
    <script src="../js/script.js"></script>
</body>
</html>
