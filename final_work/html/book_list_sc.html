<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>书籍列表 - 图书馆</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">龚达图书馆</div>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="搜索书名/作者...">
                <button id="searchBtn">搜索</button>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">首页</a></li>
                <li><a href="categories.html">图书分类</a></li>
                <li><a href="contact.html">联系我们</a></li>
                <li><a href="login.html" id="loginLink">登录</a></li>
                <li id="userDisplay" style="display:none; color: var(--accent-color); font-weight: bold;"></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="book-list-container">
            <h1>科学类别书籍</h1>
            <p class="category-description">在这里可以找到所有的科学类书籍。</p>    
            <div class="book-grid">
                <!-- 书籍卡片示例 -->
                <div class="book-card" onclick="location.href='detail.html?title=物种起源'">
                    <img src="../images/物种起源.png" alt="图书封面">
                    <div class="book-card-info">
                        <h3>物种起源</h3>
                        <p>Charles Darwin</p>
                        <span class="status available">可借阅</span>
                    </div>
                </div>
                <div class="book-card" onclick="location.href='detail.html?title=时间简史'">
                    <img src="../images/时间简史.png" alt="图书封面">
                    <div class="book-card-info">
                        <h3>时间简史</h3>
                        <p>Stephen Hawking</p>
                        <span class="status available">可借阅</span>
                    </div>
                </div>
                <div class="book-card" onclick="location.href='detail.html?title=自然哲学的数学原理'">
                    <img src="../images/自然哲学的数学原理.png" alt="图书封面">
                    <div class="book-card-info">
                        <h3>自然哲学的数学原理</h3>
                        <p>Isaac Newton</p>
                        <span class="status available">可借阅</span>
                    </div>
                </div>
                <div class="book-card" onclick="location.href='detail.html?title=关于两大世界体系的对话'">
                    <img src="../images/关于世界两大体系的对话.png" alt="图书封面">
                    <div class="book-card-info">
                        <h3>关于两大世界体系的对话</h3>
                        <p>Galileo Galilei</p>
                        <span class="status available">可借阅</span>
                    </div>
                </div>
            </div>
            <div class="pagination">
                <a href="#" class="btn-small">上一页</a>
                <span class="page-num">1 / 5</span>
                <a href="#" class="btn-small">下一页</a>
            </div>
        </section>
    </main>
    <footer>
        <div class="footer-content container">
            <div class="footer-info">
                <p>&copy; 2026 龚达图书馆. All rights reserved.</p>
                <p>技术支持：前端开发大作业团队</p>
            </div>
            <div class="share-links">
                <span>分享到：</span>
                <a href="#">微信</a>
                <a href="#">微博</a>
                <a href="#">QQ</a>
            </div>
        </div>
    </footer>
    <button id="backToTop" class="back-to-top" onclick="window.scrollTo(0,0)">↑</button>
    <script src="../js/script.js"></script>
</body>
</html>
