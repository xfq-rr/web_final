<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心 - 龚达图书馆</title>
    <link rel="stylesheet" href="../css/style.css">
    <!-- 引入独立的个人中心样式 -->
    <link rel="stylesheet" href="../css/personal.css">
</head>
<body>
    <header>
        <div class="logo">龚达图书馆</div>
        <div class="search-bar">
            <input type="text" placeholder="搜索书名/作者..." style="padding: 8px; border-radius: 20px; border: none; width: 300px;">
            <button style="background: none; border: none; color: #c9a96e; cursor: pointer;">搜索</button>
        </div>
        <ul class="nav-links">
            <li><a href="index.html">首页</a></li>
            <li><a href="categories.html">图书分类</a></li>
            <li><a href="contact.html">联系我们</a></li>
            <li><a href="profile.html">我的借阅</a></li>
            <li class="user-area">
                <div class="avatar-icon">👤</div>
                <span id="headerUsername" style="color: #c9a96e; font-weight: bold;"></span>
                <a href="javascript:logout()" style="color: white; text-decoration: none;">退出</a>
            </li>
        </ul>
    </header>

    <div class="container">
        <h1 style="text-align: center; color: #333; margin-bottom: 30px;">个人中心</h1>

        <!-- 个人信息 -->
        <div class="card">
            <div class="avatar-wrapper">
                <img id="userAvatar" src="../images/default-avatar.jpg" alt="用户头像" class="avatar">
                <button class="btn-change-avatar" onclick="document.getElementById('avatarInput').click()">更换头像</button>
                <input type="file" id="avatarInput" accept="image/*" style="display: none;">
            </div>

            <h2>我的信息</h2>
            <div class="info-item">
                昵称：<span id="userNick">用户昵称</span>
                <span class="edit-btn" onclick="editNick()">编辑</span>
            </div>
            <div class="info-item">手机号：138****1234</div>
            <div class="info-item">注册时间：2024-01-01</div>
            <div class="info-item">
                当前借阅：<span id="borrowCount">0</span>本
                <a href="profile.html" style="color: #8b7355; text-decoration: underline; margin-left: 5px;">查看详情</a>
            </div>
        </div>

        <!-- 当前借阅 -->
        <div class="card">
            <h2>当前借阅</h2>
            <div id="currentBorrowList">
                <div class="empty-tip">您目前还没有借阅任何图书</div>
            </div>
        </div>

        <!-- 借阅记录 -->
        <div class="card">
            <h2>借阅记录</h2>
            <div id="historyList">
                <div class="empty-tip">暂无借阅记录</div>
            </div>
        </div>
    </div>

    <!-- 引入独立的个人中心脚本 -->
    <script src="../js/personal.js"></script>
</body>
</html>
