<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>书籍列表 - 图书馆</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">龚达图书馆</div>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="搜索书名/作者...">
                <button id="searchBtn">搜索</button>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">首页</a></li>
                <li><a href="categories.html">图书分类</a></li>
                <li><a href="contact.html">联系我们</a></li>
                <li><a href="login.html" id="loginLink">登录</a></li>
                <li id="userDisplay" style="display:none; color: var(--accent-color); font-weight: bold;"></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="book-list-container">
            <h1>艺术类别书籍</h1>
            <p class="category-description">在这里可以找到所有的艺术类书籍。</p>            
            <div class="book-grid">
                <!-- 书籍卡片示例 -->
                <div class="book-card" onclick="location.href='detail.html?title=艺术的故事'">
                    <img src="../images/艺术的故事.png" alt="图书封面">
                    <div class="book-card-info">
                        <h3>艺术的故事</h3>
                        <p>E. H. Gombrich</p>
                        <span class="status available">可借阅</span>
                    </div>
                </div>
                <div class="book-card" onclick="location.href='detail.html?title=机械复制时代的艺术作品'">
                    <img src="../images/机械复制时代的艺术作品.png" alt="图书封面">
                    <div class="book-card-info">
                        <h3>机械复制时代的艺术作品</h3>
                        <p>Walter Benjamin</p>
                        <span class="status available">可借阅</span>
                    </div>
                </div>
                <div class="book-card" onclick="location.href='detail.html?title=名画家传'">
                    <img src="../images/名画家传.png" alt="图书封面">
                    <div class="book-card-info">
                        <h3>名画家传</h3>
                        <p>Giorgio Vasari</p>
                        <span class="status available">可借阅</span>
                    </div>
                </div>
                <div class="book-card" onclick="location.href='detail.html?title=艺术与错觉'">
                    <img src="../images/艺术与错觉.png" alt="图书封面">
                    <div class="book-card-info">
                        <h3>艺术与错觉</h3>
                        <p>E. H. Gombrich</p>
                        <span class="status available">可借阅</span>
                    </div>
                </div>
            </div>
            <div class="pagination">
                <a href="#" class="btn-small">上一页</a>
                <span class="page-num">1 / 5</span>
                <a href="#" class="btn-small">下一页</a>
            </div>
        </section>
    </main>
    <footer>
        <div class="footer-content container">
            <div class="footer-info">
                <p>&copy; 2026 龚达图书馆. All rights reserved.</p>
                <p>技术支持：前端开发大作业团队</p>
            </div>
            <div class="share-links">
                <span>分享到：</span>
                <a href="javascript:alert('已复制链接，可粘贴到微信分享！')">微信</a>
                <a href="https://service.weibo.com/share/share.php?url=http://127.0.0.1:3000/final_work/html/book_list_art.html&title=龚达图书馆" target="_blank">微博</a>
                <a href="https://connect.qq.com/widget/shareqq/index.html?url=http://127.0.0.1:3000/final_work/html/book_list_art.html&title=龚达图书馆" target="_blank">QQ</a>
            </div>
        </div>
    </footer>
    <button id="backToTop" class="back-to-top" onclick="window.scrollTo(0,0)">↑</button>
    <script src="../js/script.js"></script>
</body>
</html>
